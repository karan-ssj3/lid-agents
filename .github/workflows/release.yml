name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n bin/agents install.sh scripts/build.sh
          brew install shellcheck >/dev/null
          shellcheck -S warning bin/agents install.sh scripts/build.sh

      - name: Build
        run: scripts/build.sh "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Build (untagged)
        run: scripts/build.sh
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: Smoke test
        run: |
          app=build/LidAgents.app
          lipo -info "$app/Contents/MacOS/LidAgents"
          "$app/Contents/Resources/agents" version
          "$app/Contents/Resources/agents" state
          "$app/Contents/Resources/agents" busy

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/lid-agents.tar.gz install.sh \
            --title "Lid Agents ${GITHUB_REF_NAME}" --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md)
